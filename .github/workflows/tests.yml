on:
  push:
  pull_request:

name: 'Tests Edisio'

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Debian 11 (PHP 7.4), Debian 12 (PHP 8.2)
        php: ['7.4', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: find . -name '*.php' -not -path './resources/python_venv/*' -print0 | xargs -0 -n1 php -l
      - name: Run PHP tests
        run: for test in tests/php/*_test.php; do php "$test" || exit 1; done

  python:
    runs-on: ubuntu-latest
    # setup-python has no 3.9 build for ubuntu-latest (26.04): use the official images
    container: python:${{ matrix.python }}-slim
    strategy:
      matrix:
        # Debian 11 (3.9), Debian 12 (3.11), Debian 13 (3.13)
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Run Python tests
        run: python -W error::DeprecationWarning -m unittest discover -s tests/python -v
